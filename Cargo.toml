[package]
name = "strictsh"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
description = "An opinionated POSIX sh profile and deterministic diagnostic oracle for coding agents"
license = "MIT"
repository = "https://github.com/ilvar/strictsh"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"

[dev-dependencies]
tempfile = "=3.23.0"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
as_conversions = "deny"
wildcard_imports = "deny"
unused_unit = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
